name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "LICENSE"
      - ".github/workflows/docs-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "LICENSE"
      - ".github/workflows/docs-build.yml"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Docker Multi-Arch Build"
    types:
      - completed
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 tools/pyproject-deps.py docs > requirements-docs.txt
          cat requirements-docs.txt
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      - name: Copy generated documentation sources
        run: |
          cp CHANGELOG.md docs/changelog.md
          cp LICENSE docs/license.md

      - name: Build documentation
        run: mkdocs build --strict

      # The site is served under /caddybuddy/, so lychee resolves root-relative
      # links against a root dir where caddybuddy/ points at the built site.
      - name: Prepare link check root
        run: |
          mkdir -p "$RUNNER_TEMP/linkcheck-root"
          ln -sfn "$GITHUB_WORKSPACE/site" "$RUNNER_TEMP/linkcheck-root/caddybuddy"

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --root-dir '${{ runner.temp }}/linkcheck-root'
            --exclude 'fonts\.gstatic\.com'
            --exclude 'gill-bates\.github\.io/caddybuddy'
            './site/**/*.html'
          fail: true

      - name: Upload Pages artifact
        if: |
          github.ref == 'refs/heads/main' &&
          (
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'workflow_run'
          )
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Materialize docs dependencies for scanning
        run: python3 tools/pyproject-deps.py docs > requirements-docs.txt

      - name: Scan documentation dependencies
        uses: aquasecurity/trivy-action@master
        with:
          cache: "false"
          scan-type: fs
          scan-ref: requirements-docs.txt
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          timeout: 5m

  deploy:
    if: |
        github.ref == 'refs/heads/main' &&
        (
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'workflow_run'
        )
    needs:
      - build
      - security-scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
