name: Docker Multi-Arch Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: docker.io

jobs:
  meta:
    name: Validate build metadata
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      build_date: ${{ steps.meta.outputs.build_date }}
      version: ${{ steps.meta.outputs.version }}
      is_newest: ${{ steps.newest.outputs.is_newest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?Missing DOCKERHUB_USERNAME secret}"
          : "${DOCKERHUB_TOKEN:?Missing DOCKERHUB_TOKEN secret}"

      - name: Validate and set build metadata
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          if ! echo "$DOCKERHUB_USERNAME" | grep -qE '^[a-z0-9][a-z0-9_-]{2,}$'; then
            echo "ERROR: Invalid Docker Hub username/namespace: '$DOCKERHUB_USERNAME'"
            exit 1
          fi

          if [ ! -f pyproject.toml ]; then
            echo "ERROR: pyproject.toml not found"
            exit 1
          fi

          # pyproject.toml [project] version is the single source of truth -
          # app/utils/version.py reads the same key at runtime.
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])' | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            echo "ERROR: pyproject.toml has no [project] version"
            exit 1
          fi

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "ERROR: Invalid version format: '$VERSION' (expected: X.Y, X.Y.Z or either with -suffix)"
            exit 1
          fi

          # A release must always run from the v<VERSION> tag. Without this
          # check a manual run on a branch could republish an existing
          # ${VERSION} image from a different commit and move 'latest' with it.
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "ERROR: This workflow must run from a tag, but ref '${GITHUB_REF_NAME}' is a ${GITHUB_REF_TYPE}."
            echo "Push tag v${VERSION}, or re-run this workflow selecting that tag as the ref."
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "ERROR: Git tag (${GITHUB_REF_NAME}) does not match pyproject.toml version (${VERSION})"
            exit 1
          fi

          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # A release must not travel backwards. Re-running this workflow on an
      # older tag would otherwise pass every check above and move 'latest'
      # onto the older image, then let the cleanup job delete the newer tag.
      # Only the highest version this repository has ever published moves
      # 'latest' or prunes anything; an older re-run still republishes its
      # own version tag, it just cannot rewrite the newer release's history.
      - name: Determine whether this is the newest release
        id: newest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPOSITORY: caddybuddy
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          hub_token="$(
            jq -nc \
              --arg username "$DOCKERHUB_USERNAME" \
              --arg password "$DOCKERHUB_TOKEN" \
              '{username: $username, password: $password}' \
            | curl -fsSL \
                -H 'Content-Type: application/json' \
                -d @- \
                'https://hub.docker.com/v2/users/login/' \
            | jq -r '.token // .access_token // empty'
          )"

          if [[ -z "$hub_token" ]]; then
            echo "ERROR: Failed to obtain Docker Hub API token"
            exit 1
          fi

          api_base="https://hub.docker.com/v2/namespaces/${DOCKERHUB_USERNAME}/repositories/${REPOSITORY}/tags"
          next_url="${api_base}?page_size=100"
          : > published-tags.txt

          # A repository that does not exist yet answers 404 - the very first
          # release, not an error, since it has no published tag to outrank.
          while [[ -n "$next_url" && "$next_url" != "null" ]]; do
            response="$(curl -fsSL -H "Authorization: Bearer ${hub_token}" "$next_url" || true)"
            [[ -n "$response" ]] || break
            printf '%s' "$response" | jq -r '.results[].name' >> published-tags.txt
            next_url="$(printf '%s' "$response" | jq -r '.next // empty')"
          done

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import sys

          # Architecture fragments (1.5.0-amd64) parse as prereleases of
          # 1.5.0 and would otherwise be compared as versions. They are
          # build artefacts of this workflow, not releases.
          ARCH_SUFFIXES = {"amd64", "arm64"}
          VERSION_RE = re.compile(r"^(\d+(?:\.\d+)*)(?:-([0-9A-Za-z.-]+))?$")

          def key(tag):
              match = VERSION_RE.match(tag)
              if not match:
                  return None
              suffix = match.group(2)
              if suffix in ARCH_SUFFIXES:
                  return None
              release = tuple(int(part) for part in match.group(1).split("."))
              return (release, (0, suffix) if suffix else (1, ""))

          current = os.environ["VERSION"]
          current_key = key(current)
          assert current_key is not None, f"unparseable version: {current}"

          with open("published-tags.txt", encoding="utf-8") as handle:
              published = {line.strip() for line in handle if line.strip()}

          newer = sorted(
              tag for tag in published
              if (tag_key := key(tag)) is not None and tag_key > current_key
          )

          if newer:
              print(f"Newer versions already published: {', '.join(newer)}", file=sys.stderr)
              print(f"{current} will be republished, but 'latest' stays put "
                    "and nothing is pruned.", file=sys.stderr)
              print("is_newest=false")
          else:
              print(f"{current} is the newest published version.", file=sys.stderr)
              print("is_newest=true")
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # pyproject.toml pins none of the application's dependencies, so
      # "newest" is decided once per release rather than twice by two
      # runners reaching their pip layer minutes apart. This resolves the
      # full transitive set for both target platforms and hands it to every
      # architecture build as a pip constraints file.
      - name: Resolve runtime dependency versions
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip uv

          python -c 'import tomllib; print("\n".join(tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]))' \
            > runtime-requirements.txt
          cat runtime-requirements.txt

          for platform in x86_64-manylinux_2_28 aarch64-manylinux_2_28; do
            uv pip compile \
              --quiet --no-header \
              --python-version 3.13 \
              --python-platform "$platform" \
              runtime-requirements.txt \
              -o "constraints-${platform}.txt"
          done

          if ! diff -u \
            constraints-x86_64-manylinux_2_28.txt \
            constraints-aarch64-manylinux_2_28.txt; then
            echo "ERROR: linux/amd64 and linux/arm64 do not resolve to one set of versions."
            echo "A dependency is missing a wheel for one of them - the images could only"
            echo "be published with different versions, so this release stops here."
            exit 1
          fi

          mv constraints-x86_64-manylinux_2_28.txt constraints.txt
          rm -f constraints-aarch64-manylinux_2_28.txt runtime-requirements.txt
          resolved_count="$(grep -cE '^[^#[:space:]]' constraints.txt || true)"
          if (( resolved_count == 0 )); then
            echo "ERROR: the resolution produced no versions at all"
            exit 1
          fi
          echo "Both platforms resolve to the same ${resolved_count} versions:"
          cat constraints.txt

      - name: Upload resolved constraints
        uses: actions/upload-artifact@v7
        with:
          name: constraints
          path: constraints.txt
          retention-days: 14
          if-no-files-found: error

  build:
    name: Build ${{ matrix.arch }} image
    needs: meta
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE_NAME: ${{ format('{0}/caddybuddy', secrets.DOCKERHUB_USERNAME) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            cache_scope: caddybuddy-amd64
            test_image: caddybuddy:test-amd64
            container_name: caddybuddy-test-amd64
            mock_container: caddy-mock-amd64
            network: smoke-amd64
            smoke_dir: smoke-test-amd64
            image_suffix: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            cache_scope: caddybuddy-arm64
            test_image: caddybuddy:test-arm64
            container_name: caddybuddy-test-arm64
            mock_container: caddy-mock-arm64
            network: smoke-arm64
            smoke_dir: smoke-test-arm64
            image_suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Generate BUILD_INFO
        run: |
          set -euo pipefail
          cat > BUILD_INFO <<EOF
          GIT_SHA=${{ github.sha }}
          BUILD_DATE=${{ needs.meta.outputs.build_date }}
          EOF

      # The dependency versions the meta job resolved once, dropped into the
      # build context so docker/Dockerfile picks them up via its
      # `COPY pyproject.toml constraints*.txt ./`. Both architectures get
      # this same file, which is what makes their venvs identical even
      # though pyproject.toml pins nothing.
      - name: Download resolved constraints
        uses: actions/download-artifact@v7
        with:
          name: constraints

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false
          driver-opts: |
            image=moby/buildkit:v0.16.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image for smoke tests
        run: |
          set -euo pipefail
          docker buildx build \
            --pull \
            --platform "${{ matrix.platform }}" \
            --target runtime \
            --load \
            --cache-from type=gha,scope=${{ matrix.cache_scope }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.cache_scope }} \
            --build-arg "APP_VERSION=${VERSION}" \
            --build-arg "GIT_SHA=${{ github.sha }}" \
            --build-arg "BUILD_DATE=${{ needs.meta.outputs.build_date }}" \
            -t "${{ matrix.test_image }}" \
            -f docker/Dockerfile \
            .

      - name: Smoke test (${{ matrix.arch }})
        run: |
          set -euo pipefail
          IMAGE="${{ matrix.test_image }}"

          cleanup() {
            docker rm -f "${{ matrix.container_name }}" 2>/dev/null || true
            docker rm -f "${{ matrix.mock_container }}" 2>/dev/null || true
            docker network rm "${{ matrix.network }}" 2>/dev/null || true
            sudo rm -rf "${{ matrix.smoke_dir }}"
          }
          trap cleanup EXIT

          mkdir -p "${{ matrix.smoke_dir }}/data"
          printf '### MANAGED BY CADDYBUDDY ###\n' > "${{ matrix.smoke_dir }}/Caddyfile"
          sudo chown -R 1000:1000 "${{ matrix.smoke_dir }}/data"
          sudo chown 1000:1000 "${{ matrix.smoke_dir }}/Caddyfile"

          docker network create "${{ matrix.network }}"

          # Mock Caddy API
          docker run -d --name "${{ matrix.mock_container }}" \
            --network "${{ matrix.network }}" \
            python:3.13-alpine \
            python -c 'from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(b"{}")
              def do_POST(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(b"{}")
              def log_message(self, *_):
                  pass
          HTTPServer(("0.0.0.0", 2019), H).serve_forever()'

          docker run -d --name "${{ matrix.container_name }}" \
            --platform "${{ matrix.platform }}" \
            --network "${{ matrix.network }}" \
            -e CB_SECRET_KEY="ci-smoke-test-key-not-for-production" \
            -e LOG_LEVEL="DEBUG" \
            -v "$PWD/${{ matrix.smoke_dir }}/Caddyfile:/app/Caddyfile" \
            -v "$PWD/${{ matrix.smoke_dir }}/data:/app/data" \
            "$IMAGE"

          echo "Waiting for health endpoint..."
          for i in $(seq 1 45); do
            if ! docker ps -q -f name="${{ matrix.container_name }}" | grep -q .; then
              echo "✗ Container exited during startup after ${i}s"
              docker logs "${{ matrix.container_name }}" 2>&1 || true
              exit 1
            fi

            if docker exec "${{ matrix.container_name }}" \
                python -c 'import sys, urllib.request; response = urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=3); sys.exit(0 if response.status < 500 else 1)' > /dev/null 2>&1; then
              echo "✓ Health check passed after ${i}s"
              break
            fi

            if [[ $i -eq 45 ]]; then
              echo "✗ Health check timeout after 45s"
              docker logs "${{ matrix.container_name }}" 2>&1 || true
              exit 1
            fi

            sleep 1
          done

          if docker exec "${{ matrix.container_name }}" sh -c 'command -v caddy' > /dev/null 2>&1; then
            echo "✗ caddy binary must not be installed in the CaddyBuddy image"
            docker exec "${{ matrix.container_name }}" sh -c 'command -v caddy && caddy version || true'
            exit 1
          fi

          echo "✓ caddy binary is not installed"

          version_seen="$(docker exec "${{ matrix.container_name }}" \
            python -c 'import sys, urllib.request, json; sys.stdout.write(json.load(urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health"))["version"])')"
          if [[ "$version_seen" != "$VERSION" ]]; then
            echo "✗ Running image reports version '${version_seen}', expected '${VERSION}'"
            exit 1
          fi
          echo "✓ Image reports version ${VERSION}"

      - name: Tag image for push
        run: |
          set -euo pipefail
          docker tag "${{ matrix.test_image }}" "${IMAGE_NAME}:${VERSION}-${{ matrix.image_suffix }}"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          cache: 'false'
          image-ref: '${{ matrix.test_image }}'
          format: 'json'
          output: 'trivy-${{ matrix.image_suffix }}.json'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '10m'
          trivyignores: '.trivyignore'

      - name: Generate Trivy summary (${{ matrix.arch }})
        if: always()
        run: |
          set -euo pipefail
          ARCH="${{ matrix.image_suffix }}"
          FILE="trivy-${ARCH}.json"

          if [[ ! -f "$FILE" ]]; then
            echo "### Trivy (${ARCH}): Scan failed — no results file" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "$FILE" 2>/dev/null || echo 0)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "$FILE" 2>/dev/null || echo 0)

          if (( CRITICAL == 0 && HIGH == 0 )); then
            SUMMARY="✅ No HIGH/CRITICAL vulnerabilities found"
          else
            SUMMARY="⚠️ ${CRITICAL} CRITICAL, ${HIGH} HIGH vulnerabilities"
          fi

          echo "### Trivy Scan Results (${ARCH})" >> "$GITHUB_STEP_SUMMARY"
          if (( CRITICAL > 0 || HIGH > 0 )); then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH") | "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName)\t\(.InstalledVersion)"' \
              "$FILE" 2>/dev/null | head -20 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Trivy findings (${{ matrix.arch }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-findings-${{ matrix.image_suffix }}
          path: trivy-${{ matrix.image_suffix }}.json
          retention-days: 14
          if-no-files-found: warn

      - name: Push arch-specific image
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME}:${VERSION}-${{ matrix.image_suffix }}"

      # The manifest is assembled from these digests rather than from the
      # arch tags. A digest names one immutable image; a tag can be
      # overwritten between this push and the manifest job.
      - name: Record image digest
        run: |
          set -euo pipefail
          mkdir -p digests

          digest="$(docker buildx imagetools inspect \
            "${IMAGE_NAME}:${VERSION}-${{ matrix.image_suffix }}" \
            --format '{{.Manifest.Digest}}')"

          case "$digest" in
            sha256:*) ;;
            *)
              echo "ERROR: unexpected digest for ${{ matrix.image_suffix }}: '${digest}'"
              exit 1
              ;;
          esac

          printf '%s' "$digest" > "digests/${{ matrix.image_suffix }}"
          echo "${{ matrix.image_suffix }} -> ${digest}"

      - name: Upload image digest (${{ matrix.arch }})
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.image_suffix }}
          path: digests/${{ matrix.image_suffix }}
          retention-days: 1
          if-no-files-found: error

  create-manifest:
    name: Create multi-arch manifest
    needs: [meta, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE_NAME: ${{ format('{0}/caddybuddy', secrets.DOCKERHUB_USERNAME) }}
      IS_NEWEST: ${{ needs.meta.outputs.is_newest }}
    permissions:
      contents: read

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@v7
        with:
          pattern: image-digest-*
          path: digests/
          merge-multiple: true

      - name: Create and push manifest
        run: |
          set -euo pipefail

          shopt -s nullglob
          digest_files=(digests/*)
          if (( ${#digest_files[@]} == 0 )); then
            echo "ERROR: no image digests were published by the build jobs"
            exit 1
          fi

          declare -a sources=()
          echo "Assembling index from:"
          for file in "${digest_files[@]}"; do
            arch="$(basename "$file")"
            digest="$(tr -d '[:space:]' < "$file")"
            sources+=("${IMAGE_NAME}@${digest}")
            echo "  linux/${arch}  ${digest}"
          done

          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${VERSION}" \
            "${sources[@]}"
          echo "Pushed manifest: ${IMAGE_NAME}:${VERSION}"

          # 'latest' moves only for a stable release, and only when this
          # really is the newest one - see the meta job's is_newest probe.
          if [[ "$VERSION" == *-* ]]; then
            echo "Skipping 'latest': ${VERSION} is a prerelease"
          elif [[ "$IS_NEWEST" != "true" ]]; then
            echo "Skipping 'latest': a newer version is already published, and 'latest' must never move backwards"
          else
            docker buildx imagetools create \
              --tag "${IMAGE_NAME}:latest" \
              "${sources[@]}"
            echo "Pushed manifest: ${IMAGE_NAME}:latest"
          fi

  # Deliberately always(): the arch tags are pushed by the build jobs, but
  # only the manifest above makes them redundant. If a later architecture or
  # the manifest step fails, the earlier architecture's tag is already on
  # Docker Hub with nothing left to remove it. This job removes them on every
  # outcome, cancellation included.
  cleanup-arch-tags:
    name: Remove architecture fragment tags
    needs: [meta, build, create-manifest]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Download image digests
        id: digests
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: image-digest-*
          path: digests/
          merge-multiple: true

      - name: Delete architecture tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPOSITORY: caddybuddy
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -z "${VERSION}" ]]; then
            echo "No version resolved - nothing was pushed, nothing to clean up."
            exit 0
          fi

          shopt -s nullglob
          digest_files=(digests/*)
          if (( ${#digest_files[@]} == 0 )); then
            echo "No image digests were published - no architecture tags exist."
            exit 0
          fi

          hub_token="$(
            jq -nc \
              --arg username "$DOCKERHUB_USERNAME" \
              --arg password "$DOCKERHUB_TOKEN" \
              '{username: $username, password: $password}' \
            | curl -fsSL \
                -H 'Content-Type: application/json' \
                -d @- \
                'https://hub.docker.com/v2/users/login/' \
            | jq -r '.token // .access_token // empty'
          )"

          if [[ -z "$hub_token" ]]; then
            echo "ERROR: Failed to obtain Docker Hub API token"
            exit 1
          fi

          api_base="https://hub.docker.com/v2/namespaces/${DOCKERHUB_USERNAME}/repositories/${REPOSITORY}/tags"

          for file in "${digest_files[@]}"; do
            tag="${VERSION}-$(basename "$file")"
            status_code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer ${hub_token}" \
              "${api_base}/${tag}")"

            case "$status_code" in
              202|204) echo "Deleted fragment tag: ${tag}" ;;
              404)     echo "Fragment tag already absent: ${tag}" ;;
              *)
                echo "ERROR: Failed to delete '${tag}' (HTTP ${status_code})"
                exit 1
                ;;
            esac
          done

  # The destructive step: it deletes every published tag except the current
  # version and 'latest'. Gated on is_newest as well, so an older re-run
  # cannot delete the newer releases that came after it. Ordered after the
  # fragment cleanup so the two are not racing to delete the same tags.
  cleanup-dockerhub-tags:
    name: Keep only latest and current version tag
    needs: [meta, create-manifest, cleanup-arch-tags]
    if: >-
      needs.create-manifest.result == 'success' &&
      needs.cleanup-arch-tags.result == 'success' &&
      needs.meta.outputs.is_newest == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read

    steps:
      - name: Delete all non-current Docker Hub tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPOSITORY: caddybuddy
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            echo "ERROR: jq is required for Docker Hub tag cleanup"
            exit 1
          fi

          keep_version="${VERSION}"
          keep_latest="latest"
          api_base="https://hub.docker.com/v2/namespaces/${DOCKERHUB_USERNAME}/repositories/${REPOSITORY}/tags"

          list_tags() {
            local next_url="${api_base}?page_size=100"
            local response=""

            while [[ -n "$next_url" && "$next_url" != "null" ]]; do
              response="$(curl -fsSL \
                -H "Authorization: Bearer ${hub_token}" \
                "$next_url")"

              printf '%s' "$response" | jq -r '.results[].name'
              next_url="$(printf '%s' "$response" | jq -r '.next // empty')"
            done
          }

          wait_for_tag_absent() {
            local tag="$1"
            local tag_url="${api_base}/${tag}"
            local status_code=""

            for _ in $(seq 1 12); do
              status_code="$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${hub_token}" \
                "$tag_url")"

              case "$status_code" in
                404)
                  echo "Confirmed tag absent: $tag"
                  return 0
                  ;;
                200)
                  sleep 5
                  ;;
                *)
                  echo "ERROR: Failed to verify deletion for '$tag' (HTTP $status_code)"
                  return 1
                  ;;
              esac
            done

            echo "ERROR: Tag still visible after cleanup propagation: $tag"
            return 1
          }

          echo "Keeping Docker Hub tags:"
          echo "  ${DOCKERHUB_USERNAME}/${REPOSITORY}:${keep_version}"
          echo "  ${DOCKERHUB_USERNAME}/${REPOSITORY}:${keep_latest}"

          token_response="$(
            jq -nc \
              --arg username "$DOCKERHUB_USERNAME" \
              --arg password "$DOCKERHUB_TOKEN" \
              '{username: $username, password: $password}' \
            | curl -fsSL \
                -H 'Content-Type: application/json' \
                -d @- \
                'https://hub.docker.com/v2/users/login/'
          )"

          hub_token="$(printf '%s' "$token_response" | jq -r '.token // .access_token // empty')"
          if [[ -z "$hub_token" ]]; then
            echo "ERROR: Failed to obtain Docker Hub API token"
            printf '%s\n' "$token_response"
            exit 1
          fi

          declare -a tags_to_delete=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue

            if [[ "$tag" == "$keep_version" || "$tag" == "$keep_latest" ]]; then
              echo "Keeping tag: $tag"
              continue
            fi

            tags_to_delete+=("$tag")
          done < <(list_tags)

          for tag in "${tags_to_delete[@]}"; do
            echo "Deleting tag: $tag"
            status_code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer ${hub_token}" \
              "${api_base}/${tag}")"

            case "$status_code" in
              202|204)
                echo "Deleted tag: $tag"
                wait_for_tag_absent "$tag"
                ;;
              404)
                echo "Tag already absent: $tag"
                ;;
              *)
                echo "ERROR: Failed to delete tag '$tag' (HTTP $status_code)"
                exit 1
                ;;
            esac
          done

          declare -A remaining_tags=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            remaining_tags["$tag"]=1

            if [[ "$tag" != "$keep_version" && "$tag" != "$keep_latest" ]]; then
              echo "ERROR: Unexpected tag remained after cleanup: $tag"
              exit 1
            fi
          done < <(list_tags | sort -u)

          for tag in "$keep_latest" "$keep_version"; do
            if [[ -z "${remaining_tags[$tag]:-}" ]]; then
              echo "ERROR: Expected tag missing after cleanup: $tag"
              exit 1
            fi
          done

  create-release:
    name: Create GitHub Release
    needs: [meta, create-manifest, cleanup-arch-tags]
    if: >-
      needs.create-manifest.result == 'success' &&
      needs.cleanup-arch-tags.result == 'success'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE_NAME: ${{ format('{0}/caddybuddy', secrets.DOCKERHUB_USERNAME) }}
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download Trivy findings
        uses: actions/download-artifact@v7
        with:
          pattern: trivy-findings-*
          path: trivy-reports/
          merge-multiple: false

      - name: Create or update GitHub Release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const version = process.env.VERSION;
            const imageName = process.env.IMAGE_NAME;
            const isPrerelease = version.includes('-');

            function parseTrivyStatus(arch) {
              const file = path.join('trivy-reports', `trivy-findings-${arch}`, `trivy-${arch}.json`);
              try {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                let critical = 0, high = 0;
                for (const result of (data.Results || [])) {
                  for (const vuln of (result.Vulnerabilities || [])) {
                    if (vuln.Severity === 'CRITICAL') critical++;
                    else if (vuln.Severity === 'HIGH') high++;
                  }
                }
                return (critical === 0 && high === 0)
                  ? '✅ No HIGH/CRITICAL vulnerabilities found'
                  : `⚠️ ${critical} CRITICAL, ${high} HIGH vulnerabilities`;
              } catch {
                return '❓ Report unavailable';
              }
            }

            function normalizeVersion(value) {
              const main = value.split('-', 1)[0];
              const parts = main.split('.');
              while (parts.length < 3) {
                parts.push('0');
              }
              return parts.join('.');
            }

            function extractVersionSection(markdown, targetVersion) {
              const headingPattern = /^## \[([^\]]+)\] - .+$/gm;
              let startIndex = -1;
              let endIndex = markdown.length;
              const normalizedTargetVersion = normalizeVersion(targetVersion);
              let match;

              while ((match = headingPattern.exec(markdown)) !== null) {
                if (
                  startIndex === -1 &&
                  (match[1] === targetVersion || normalizeVersion(match[1]) === normalizedTargetVersion)
                ) {
                  startIndex = match.index;
                  continue;
                }
                if (startIndex !== -1) {
                  endIndex = match.index;
                  break;
                }
              }

              if (startIndex === -1) {
                return null;
              }
              const section = markdown.slice(startIndex, endIndex).trim();
              const withoutHeading = section.replace(/^## \[[^\]]+\] - .+\n+/, '').trim();
              const detailsIndex = withoutHeading.indexOf('<details>');
              return (detailsIndex >= 0 ? withoutHeading.slice(0, detailsIndex) : withoutHeading).trim();
            }

            let changelogSection = null;
            try {
              const changelogText = fs.readFileSync('CHANGELOG.md', 'utf8');
              changelogSection = extractVersionSection(changelogText, version);
              if (!changelogSection) {
                console.log('No matching changelog section found for version ' + version);
              }
            } catch (err) {
              console.log('Could not read CHANGELOG.md: ' + err.message);
            }

            const tags = [
              '- `' + imageName + ':' + version + '` (multi-arch)'
            ];
            if (!isPrerelease) {
              tags.push('- `' + imageName + ':latest` (multi-arch)');
            }

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const trivyAmd64 = parseTrivyStatus('amd64');
            const trivyArm64 = parseTrivyStatus('arm64');

            const body = [
              '## CaddyBuddy ' + version,
              '',
              '**Docker Image:** `docker pull ' + imageName + ':' + version + '`',
              '',
              '### Available Tags',
              ...tags,
              '',
              '### Security Scan Results',
              '',
              '| Architecture | Status | Findings |',
              '|---|---|---|',
              '| amd64 | ' + trivyAmd64 + ' | [trivy-findings-amd64](' + runUrl + '#artifacts) |',
              '| arm64 | ' + trivyArm64 + ' | [trivy-findings-arm64](' + runUrl + '#artifacts) |',
              '| run | workflow details | [Actions Run](' + runUrl + ') |',
              '',
              '> Scanned with [Trivy](https://trivy.dev/) for HIGH and CRITICAL severity vulnerabilities (unfixed CVEs ignored).',
              '',
              '### Changelog',
              changelogSection || '_No matching CHANGELOG entry found for this version._',
              '',
              '**Source:** [CaddyBuddy Repository](https://github.com/' + context.repo.owner + '/' + context.repo.repo + ')'
            ].join('\n');

            try {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: 'v' + version,
                name: 'CaddyBuddy ' + version,
                body: body,
                draft: false,
                prerelease: isPrerelease
              });
              console.log('Created release v' + version);
            } catch (e) {
              if (e.status === 422) {
                console.log('Release v' + version + ' already exists, updating...');
                const { data: release } = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: 'v' + version
                });
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  tag_name: 'v' + version,
                  name: 'CaddyBuddy ' + version,
                  body: body,
                  draft: false,
                  prerelease: isPrerelease
                });
                console.log('Updated release v' + version);
              } else {
                throw e;
              }
            }
