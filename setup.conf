# Changelog
Vergleiche die Commits seit dem letzten Release-Tag (v1.3) mit dem aktuellen Feature Branch und erstelle/aktualisiere die Changelog in englischer Sprache. Nutze dafür u.a. Commit Messages und Code Diff, um die Änderungen zu analysieren. Formuliere die Changelog kompakt und nur das Wichtigste aus Sicht eines Endbenutzers.
Unterteile zwischen "New" und "Fix" sowie "Security". "New" Punkte immer als Erstes auflisten. Halte Dich kompakt.

# Squash Merge & Tag
Mache ein Squash Merge aller Commits nach main, erstelle einen neuen tag und tagge auf v1.4 und pushe den Tag. Danach löscht du den Feature-Branch lokal und remote.