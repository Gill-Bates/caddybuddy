# --- Local Development Setup ---
command -v python3.13 >/dev/null 2>&1 && PYTHON=python3.13 || PYTHON=python3
$PYTHON -m venv /opt/caddybuddy/.venv
source /opt/caddybuddy/.venv/bin/activate
pip install --upgrade pip
pip install -r /opt/caddybuddy/requirements.txt


# --- Start Dev Server ---
export CADDYBUDDY_SECRET_KEY="l+QGUq6BH9dLZkAQpG2jivXZeLLwYNMCmzUsfcD2wPM=" # Dummy Codee
export CADDYBUDDY_ADMIN_PASSWORD="admin"
export CADDYBUDDY_ALLOW_INSECURE_DEFAULTS="true"
export LOG_LEVEL="DEBUG"
export TZ="Europe/Berlin"
cd /opt/caddybuddy && source .venv/bin/activate && python run.py


# --- Docker Login ---
docker login xxx
docker login  # Docker Hub


# --- Build & Push Image ---
cd /opt/caddybuddy && \
VERSION="$(tr -d '\r\n' < VERSION)" && \
GIT_SHA="$(git rev-parse HEAD)" && \
BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" && \
printf '%s\n' "$GIT_SHA" > BUILD_INFO && \
docker buildx build \
  --platform linux/amd64 \
  -f docker/Dockerfile \
  --build-arg APP_VERSION="$VERSION" \
  --build-arg GIT_SHA="$GIT_SHA" \
  --build-arg BUILD_DATE="$BUILD_DATE" \
  -t "docker.cirrio.de/caddybuddy:${VERSION}" \
  -t "docker.cirrio.de/caddybuddy:latest" \
  --push .


docker compose down && docker compose pull && docker compose up -d


# Allow Access from Host
ufw allow from 10.30.0.0/24 to any port 2019 proto tcp


# Design Lint
curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/master/install.sh | bash
cd /opt/caddybuddy/tools/ui-lint
npm install
npx playwright install chromium firefox webkit


cd /opt/caddybuddy/tools/ui-lint
UI_LINT_BASE_URL=http://localhost:8000 \
