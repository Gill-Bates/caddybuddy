# --- Local Development Setup ---
command -v python3.13 >/dev/null 2>&1 && PYTHON=python3.13 || PYTHON=python3
$PYTHON -m venv /opt/caddybuddy/.venv
source /opt/caddybuddy/.venv/bin/activate
pip install --upgrade pip
# pyproject.toml is the single manifest; nothing in it is pinned.
pip install -e "/opt/caddybuddy[docs]"


# --- Start Dev Server ---
export CB_SECRET_KEY="l+QGUq6BH9dLZkAQpG2jivXZeLLwYNMCmzUsfcD2wPM=" 
export LOG_LEVEL="DEBUG"
export TZ="Europe/Berlin"

cd /opt/caddybuddy && source .venv/bin/activate && python run.py

# --- Docker Login ---
docker login xxx
docker login  # Docker Hub


# --- Build & Push Image ---
PROJECT="caddybuddy" && \
cd "/opt/${PROJECT}" && \
VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" && \
GIT_SHA="$(git rev-parse --verify HEAD)" && \
BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" && \
printf 'GIT_SHA=%s\nBUILD_DATE=%s\n' "$GIT_SHA" "$BUILD_DATE" > BUILD_INFO && \
docker buildx build \
  --platform linux/amd64 \
  --pull \
  -f docker/Dockerfile \
  --build-arg APP_VERSION="$VERSION" \
  --build-arg GIT_SHA="$GIT_SHA" \
  --build-arg BUILD_DATE="$BUILD_DATE" \
  -t "docker.cirrio.de/${PROJECT}:latest" \
  --push .

docker compose down && docker compose pull && docker compose up -d


# Allow Access from Host
ufw allow from 10.30.0.0/24 to any port 2019 proto tcp


