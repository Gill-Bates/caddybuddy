# --- Squash Commit ---
Release workflow (perform only after explicit confirmation):
1. Confirm that the working tree is clean or obtain explicit approval for each outstanding change; never discard unrelated work.
2. Verify that the version in pyproject.toml matches the current branch and the intended release tag before changing history.
3. Squash-merge the feature branch into main, create the tag v1.6.2, and push the tag. Use the commit message "Release x.xx".
4. Verify the merge, tag, and remote state before deleting anything.
5. Delete the feature branch locally and remotely only after explicit confirmation and successful verification.
Never force-push, rewrite shared history, expose secrets, or delete branches as an implicit side effect of this note.

