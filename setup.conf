# --- Local Development Setup ---
command -v python3.13 >/dev/null 2>&1 && PYTHON=python3.13 || PYTHON=python3
$PYTHON -m venv /opt/caddybuddy/.venv
source /opt/caddybuddy/.venv/bin/activate
pip install --upgrade pip
pip install -r /opt/caddybuddy/requirements.txt


# --- Start Dev Server ---
export CADDYBUDDY_SECRET_KEY="l+QGUq6BH9dLZkAQpG2jivXZeLLwYNMCmzUsfcD2wPM="
export LOG_LEVEL="DEBUG"
export TZ="Europe/Berlin"
cd /opt/caddybuddy && source .venv/bin/activate && python run.py


# --- Docker Login ---
docker login xxx
docker login  # Docker Hub

export CADDYBUDDY_SECRET_KEY="$(head -c 32 /dev/urandom | base64)"
export CADDYBUDDY_ADMIN_PASSWORD="replace-with-a-strong-admin-password"


# --- Build & Push Image ---
cd /opt/caddybuddy && \
VERSION="$(cat VERSION | tr -d '\r\n')" && \
if [ -z "$VERSION" ]; then echo "VERSION is empty" >&2; exit 1; fi && \
install -d -m 0775 -o 1000 -g 1000 /opt/caddybuddy/data && \
git add -A && \
git commit -m "Build $VERSION" --allow-empty && \
git rev-parse HEAD > BUILD_INFO && \
docker buildx build --platform linux/amd64 \
  -f docker/Dockerfile \
  -t "docker.cirrio.de/caddybuddy:${VERSION}" \
  -t "docker.cirrio.de/caddybuddy:latest" \
  --push .

docker compose -f docker/docker-compose.yml down && docker compose -f docker/docker-compose.yml pull && docker compose -f docker/docker-compose.yml up -d


# Design Lint
# Logic goes here: tools/ui-lint/run-ui-lint.mjs
cd /opt/caddybuddy/tools/ui-lint
UI_LINT_BASE_URL=http://localhost:8000 \
UI_LINT_USERNAME=admin \
UI_LINT_PASSWORD=admin \
npm run audit


