services:
  caddybuddy:
    image: docker.cirrio.de/caddybuddy:latest
    container_name: caddybuddy
    restart: always
    stop_grace_period: 20s
    environment:
      CADDYBUDDY_SECRET_KEY: "l+QGUq6BH9dLZkAQpG2jivXZeLLwYNMCmzUsfcD2wPM=" # Generate with: head -c 32 /dev/urandom | base64
      CADDYBUDDY_ADMIN_PASSWORD: "admin"
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      TZ: ${TZ:-Europe/Berlin}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      TIMEOUT: ${TIMEOUT:-60}

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, urllib.request; port = os.environ.get('PORT', '8000'); response = urllib.request.urlopen(f'http://127.0.0.1:{port}/api/v1/health', timeout=3); sys.exit(0 if response.status < 500 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    networks:
      cloudnet:
        ipv4_address: 10.30.0.140
        ipv6_address: 2a02:2479:cf:7600:d0c0::140

networks:
  cloudnet:
    external: true