{% extends 'base.html' %}

{% block content %}
<section class="auth-shell">
    <div class="auth-card panel-card">
        <div class="auth-brand">
            <div class="auth-brand__logo-wrap" aria-hidden="true">
                <img src="{{ request.app.url_path_for('static', path='img/favicon.svg') }}" alt=""
                    class="auth-brand__logo">
            </div>
            <p class="auth-brand__eyebrow">{{ app_name }}</p>
        </div>

        <div class="auth-card__header">
            <h1 class="auth-card__title">Sign in</h1>
            <p class="auth-card__subtitle text-body-secondary mb-0">
                Secure access to your infrastructure control plane.
            </p>
        </div>

        <form action="/login" method="post" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="next" value="{{ request.query_params.get('next', '/') }}">

            <div class="auth-form__group">
                <label for="username" class="form-label auth-field-label">Username</label>
                <input id="username" name="username" class="form-control form-control-lg auth-form__control"
                    placeholder="Enter username" autocomplete="username" autocapitalize="off" autocorrect="off" required
                    autofocus>
            </div>

            <div class="auth-form__group auth-form__group--last">
                <label for="password" class="form-label auth-field-label">Password</label>
                <input id="password" name="password" type="password"
                    class="form-control form-control-lg auth-form__control" placeholder="••••••••"
                    autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 auth-form__submit">Sign in</button>
        </form>
    </div>
</section>
{% endblock %}
