{% extends 'base.html' %}

{% block content %}
<section class="auth-shell">
    <div class="auth-panel">
        <div class="auth-panel__intro">
            <h1>Sign in to CaddyBuddy.</h1>
            <p class="auth-panel__lede text-body-secondary mt-2 mb-0">
                Secure access to your infrastructure control plane.
            </p>
        </div>

        <div class="auth-panel__form panel-card">
            <div class="p-2">
                <h2 class="h5 mb-4">Sign in</h2>
                <form action="/login" method="post" class="d-grid gap-3">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <input type="hidden" name="next" value="{{ request.query_params.get('next', '/') }}">
                    <div>
                        <label for="username"
                            class="form-label auth-field-label small text-uppercase fw-semibold mb-2">Username</label>
                        <input id="username" name="username" class="form-control" placeholder="Enter username"
                            autocomplete="username" required autofocus>
                    </div>
                    <div>
                        <label for="password"
                            class="form-label auth-field-label small text-uppercase fw-semibold mb-2">Password</label>
                        <input id="password" name="password" type="password" class="form-control" placeholder="••••••••"
                            autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-2">Sign in</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
