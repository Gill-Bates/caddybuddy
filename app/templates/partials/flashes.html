{% if flashes %}
<div class="app-flash-stack">
    {% for flash in flashes %}
    <div class="alert alert-{{ flash.category }} alert-dismissible fade show shadow-sm border-0" role="alert"
        data-auto-dismiss-alert data-auto-dismiss-delay="5000">
        {{ flash.message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
</div>
{% endif %}
