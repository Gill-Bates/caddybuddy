{% extends 'base.html' %}

{% set page_title = "Verify sign in" %}

{% block content %}
<section class="auth-shell">
    <div class="auth-card{% if otp_error_message %} auth-card--shake{% endif %}">
        <div class="card-body p-4 p-sm-5">
            <div class="text-center mb-4">
                <div class="auth-brand__logo-wrap auth-brand__logo-wrap--wordmark mx-auto mb-3" aria-hidden="true">
                    <img src="{{ request.app.url_path_for('static', path='img/caddybuddy_1c.svg') }}" alt="" class="auth-brand__logo auth-brand__logo--wordmark">
                </div>
                <p class="text-muted small mb-0">Enter the code from your authenticator app or a recovery code.</p>
            </div>
            {% if otp_error_message %}
            <div class="alert alert-danger login-error" role="alert" data-testid="otp-error">{{ otp_error_message }}</div>
            {% endif %}
            <form action="{{ request.app.url_path_for('otp_login_action') }}" method="post" class="auth-form" data-loading-submit-form>
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label for="otp-code" class="form-label auth-field-label">Authentication code</label>
                <input id="otp-code" name="code" class="form-control form-control-lg font-monospace text-center" autocomplete="one-time-code" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="64" required autofocus>
                <p class="form-text">Use the current six-digit code, or one of your saved recovery codes.</p>
                <button type="submit" class="btn btn-primary btn-lg w-100 auth-form__submit" data-loading-submit-button data-loading-label="Verifying...">
                    <span class="spinner-border spinner-border-sm me-2 d-none" role="status" data-loading-submit-spinner></span>
                    <span data-loading-submit-label>Verify sign in</span>
                </button>
            </form>
            <form action="{{ request.app.url_path_for('cancel_otp_login') }}" method="post" class="auth-form text-center mt-3">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button type="submit" class="btn btn-link btn-sm">Cancel and return to sign in</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
