{% extends 'base.html' %}

{% block content %}
<section class="app-page">
    <div class="app-page__header">
        <div class="app-page__lede">
            <p class="eyebrow mb-2">Admin area</p>
            <h1 class="page-title mb-0">Users</h1>
        </div>
    </div>

    <div class="row app-grid">
        <div class="col-xl-4">
            <div class="panel-card">
                <div class="panel-card__header">
                    <h2 class="h5 mb-0">Add user</h2>
                </div>
                <form action="{{ request.app.url_path_for('create_user') }}" method="post" class="d-grid gap-3">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div>
                        <label class="form-label" for="user-username">Username</label>
                        <input id="user-username" name="username" class="form-control" required>
                    </div>
                    <div>
                        <label class="form-label" for="user-email">Email</label>
                        <input id="user-email" name="email" type="email" class="form-control">
                    </div>
                    <div>
                        <label class="form-label" for="user-password">Password</label>
                        <input id="user-password" name="password" type="password" minlength="8" class="form-control"
                            autocomplete="new-password" required>
                    </div>
                    <div>
                        <label class="form-label" for="user-role">Role</label>
                        <select id="user-role" name="role" class="form-select">
                            <option value="user">user</option>
                            <option value="admin">admin</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Create user</button>
                </form>
            </div>
        </div>

        <div class="col-xl-8">
            <div class="panel-card panel-card--table">
                <div class="panel-card__header">
                    <h2 class="h5 mb-0">Directory</h2>
                </div>
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Role</th>
                                <th>Email</th>
                                <th>Last login</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for user in users %}
                            <tr>
                                <td>{{ user.username }}</td>
                                <td><span class="badge text-bg-dark">{{ user.role }}</span></td>
                                <td>{{ user.email or '-' }}</td>
                                <td>{{ user.last_login|datetimeformat }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
