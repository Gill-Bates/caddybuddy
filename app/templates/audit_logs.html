{% extends 'base.html' %}

{% block content %}
<section class="app-page audit-logs-page">
    <div class="app-page__header">
        <div class="app-page__lede">
            <p class="eyebrow mb-2">Traceability</p>
            <h1 class="page-title mb-0">Audit Logs</h1>
        </div>
    </div>

    <div class="panel-card panel-card--table audit-logs-card">
        <div class="panel-card__header flex-wrap">
            <h2 class="h5 mb-0">Latest events</h2>
            <div class="audit-logs-filters d-flex flex-wrap gap-2 align-items-center ms-auto mt-3 mt-md-0">
                <input type="text" id="filterSearch" class="form-control form-control-sm audit-logs-filter"
                    placeholder="Search..." aria-label="Search logs">
                <select id="filterUsername" class="form-select form-select-sm audit-logs-filter"
                    aria-label="Filter by user">
                    <option value="">All users</option>
                    {% for username in usernames %}
                    <option value="{{ username }}">{{ username }}</option>
                    {% endfor %}
                </select>
                <input type="date" id="filterDateFrom" class="form-control form-control-sm audit-logs-filter"
                    aria-label="From date" title="From date">
                <input type="date" id="filterDateTo" class="form-control form-control-sm audit-logs-filter"
                    aria-label="To date" title="To date">
                <button type="button" id="filterReset"
                    class="btn btn-outline-secondary btn-sm audit-logs-filter-reset">Reset</button>
            </div>
        </div>
        <div class="audit-logs-stream" id="auditTableContainer">
            <div id="auditTableBody" class="audit-feed">
                <div id="loadingRow" class="audit-feed__status">
                    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                    Loading entries...
                </div>
            </div>
            <div id="loadMoreSentinel" class="py-3 text-center d-none" aria-hidden="true">
                <span class="spinner-border spinner-border-sm text-muted" role="status" aria-hidden="true"></span>
            </div>
        </div>
        <div class="border-top pt-2 mt-auto px-3 pb-2">
            <small class="text-body-secondary">
                Showing <span id="visibleCount">0</span> of <span id="totalCount">0</span> entries
            </small>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ request.app.url_path_for('static', path='js/audit-logs.js') }}"></script>
{% endblock %}
